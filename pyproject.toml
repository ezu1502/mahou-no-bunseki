[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=3.0"
]
build-backend = "scikit_build_core.build"

[project]
name = "pybunseki"
version = "0.1.0"
description = "Audio analysis library written in C++ and Python"
requires-python = ">=3.13"
readme = "README.md"

[tool.scikit-build]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = []